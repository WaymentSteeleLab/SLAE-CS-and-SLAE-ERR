# Environment used to re-run every notebook in this repository (tested on macOS and Linux, Python 3.11).
#   conda env create -f environment.yml && conda activate slae-cs-analysis
# External command-line tools (see DATA.md section 6): `mkdssp` (installed below)
# and `foldseek` (download separately) must be on PATH.
name: slae-cs-analysis
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.0.2
  - pandas=2.2.2
  - scipy=1.14.1
  - matplotlib=3.10.3
  - seaborn=0.13.2
  - scikit-learn=1.6.1
  - statsmodels=0.14.6
  - mdtraj=1.10.3
  - biopython=1.86
  - adjusttext=1.3.0
  - joblib=1.4.2
  - tqdm=4.67.1
  - pyyaml
  - dssp=4.6.1          # provides mkdssp; if it cannot find mmcif_pdbx.dic, set LIBCIFPP_DATA_DIR=$CONDA_PREFIX/share/libcifpp
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      - tmtools==0.3.0
      - pynmrstar==3.3.5
      - huggingface-hub==0.36.0   # scripts/download_analysis_data.py
      - nmrglue==0.11   # needed by external/makeshift
      - scikit-image==0.26.0   # Fig5/hk_rama_regions.py
